name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bun run test
      # Generic PII rules only; the private denylist is never available in CI.
      - run: bun run scan
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
